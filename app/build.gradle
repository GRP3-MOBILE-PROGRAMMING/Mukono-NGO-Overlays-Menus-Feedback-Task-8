plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'      // reads app/google-services.json
    id 'com.google.firebase.firebase-perf'   // automatic app-start, screen-rendering and HTTP traces
}

// --- CI hooks --------------------------------------------------------------------
// Jenkins binds the "Secret file" credential to this env var; the file is never in Git.
def ciGoogleServices = System.getenv('GOOGLE_SERVICES_JSON')
if (ciGoogleServices) {
    file('google-services.json').bytes = new File(ciGoogleServices).bytes
}
def ciBuildNumber = (System.getenv('BUILD_NUMBER') ?: '1') as Integer

// Beneficiary profiles and the warehouse manifest are fetched over HTTPS from this repo
// (raw.githubusercontent.com), so the qr_beneficiary_fetch trace and the automatic
// network request metrics measure a real network call. Override with -PfieldDataRef=<branch>.
def fieldDataRef = project.findProperty('fieldDataRef') ?: 'main'
def fieldDataBaseUrl = project.findProperty('fieldDataBaseUrl') ?:
        "https://raw.githubusercontent.com/GRP3-MOBILE-PROGRAMMING/Mukono-NGO-Overlays-Menus-Feedback-Task-8/${fieldDataRef}/app/src/main/assets/field-data/"
// Confirm Delivery POST endpoint (echo service until the NGO backend exists).
def confirmDeliveryUrl = project.findProperty('confirmDeliveryUrl') ?: 'https://httpbin.org/post'

android {
    namespace 'com.example.mukonongomap'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.mukonongomap'
        minSdk 23
        targetSdk 28
        versionCode ciBuildNumber
        versionName "1.0.${ciBuildNumber}"

        buildConfigField 'String', 'FIELD_DATA_BASE_URL', "\"${fieldDataBaseUrl}\""
        buildConfigField 'String', 'CONFIRM_DELIVERY_URL', "\"${confirmDeliveryUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'PERF_COLLECTION_ENABLED', 'true'
        }
        release {
            minifyEnabled false
            buildConfigField 'boolean', 'PERF_COLLECTION_ENABLED', 'true'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        xmlReport true
        htmlReport true
        abortOnError false   // Jenkins Warnings NG quality gate decides pass/fail
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Camera + on-device QR decoding (the camera-init and decode traces measure these)
    def camerax = '1.4.1'
    implementation "androidx.camera:camera-core:${camerax}"
    implementation "androidx.camera:camera-camera2:${camerax}"
    implementation "androidx.camera:camera-lifecycle:${camerax}"
    implementation "androidx.camera:camera-view:${camerax}"
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Firebase Performance Monitoring
    implementation platform('com.google.firebase:firebase-bom:34.14.1')
    implementation 'com.google.firebase:firebase-perf'

    testImplementation 'junit:junit:4.13.2'
}
